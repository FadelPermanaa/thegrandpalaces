<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241E19"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C983"/>
      <stop offset="1" stop-color="#9A7430"/>
    </linearGradient>
  </defs>
  <rect width="960" height="720" fill="url(#bg)"/>
  <!-- art deco sunburst -->
  <g stroke="#C9A050" stroke-width="1.5" opacity="0.5">
    <line x1="480" y1="140" x2="140" y2="360"/><line x1="480" y1="140" x2="820" y2="360"/>
    <line x1="480" y1="140" x2="260" y2="420"/><line x1="480" y1="140" x2="700" y2="420"/>
    <line x1="480" y1="140" x2="360" y2="470"/><line x1="480" y1="140" x2="600" y2="470"/>
  </g>
  <circle cx="480" cy="140" r="26" fill="none" stroke="#E6C983" stroke-width="2"/>
  <circle cx="480" cy="140" r="14" fill="none" stroke="#E6C983"/>
  <!-- skyline -->
  <g fill="#1A1613" stroke="#C9A050" stroke-width="1">
    <rect x="60" y="430" width="80" height="170"/>
    <rect x="180" y="390" width="70" height="210"/>
    <rect x="300" y="450" width="90" height="150"/>
    <rect x="430" y="410" width="70" height="190"/>
    <rect x="540" y="370" width="60" height="230"/>
    <rect x="640" y="440" width="80" height="160"/>
    <rect x="760" y="400" width="70" height="200"/>
  </g>
  <!-- golden geometric band -->
  <g stroke="#C9A050" stroke-width="2" fill="none">
    <path d="M0 500 L120 560 L240 500 L360 560 L480 500 L600 560 L720 500 L840 560 L960 500"/>
    <rect x="440" y="470" width="80" height="30" fill="#0E0C0A"/>
  </g>
  <!-- central diamond monogram -->
  <g transform="translate(480 300)" fill="none" stroke="#E6C983" stroke-width="2">
    <rect x="-70" y="-70" width="140" height="140" transform="rotate(45)"/>
    <rect x="-50" y="-50" width="100" height="100" transform="rotate(45)"/>
    <circle r="8" fill="#E6C983" stroke="none"/>
  </g>
  <text x="480" y="650" text-anchor="middle" font-family="Playfair Display,serif" font-size="40" fill="#E3CE9F" letter-spacing="8">E · V</text>
</svg>
