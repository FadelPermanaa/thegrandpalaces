<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EC"/>
      <stop offset="1" stop-color="#EAD9C4"/>
    </linearGradient>
    <linearGradient id="canal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A9BB0"/>
      <stop offset="1" stop-color="#3E6B84"/>
    </linearGradient>
  </defs>
  <rect width="960" height="480" fill="url(#sky)"/>
  <!-- renaissance skyline -->
  <g fill="#B8967E" opacity="0.9">
    <rect x="40" y="300" width="60" height="180"/>
    <rect x="120" y="260" width="70" height="220"/>
    <rect x="210" y="320" width="80" height="160"/>
    <rect x="310" y="240" width="60" height="240"/>
    <rect x="390" y="330" width="70" height="150"/>
    <rect x="700" y="270" width="70" height="210"/>
    <rect x="790" y="320" width="80" height="160"/>
    <rect x="880" y="280" width="60" height="200"/>
  </g>
  <!-- dome + campanile -->
  <g fill="#C9A058">
    <path d="M360 240 C360 200 420 200 420 240 Z"/>
  </g>
  <g fill="#B8967E">
    <rect x="360" y="240" width="60" height="40"/>
  </g>
  <!-- canal water -->
  <rect y="480" width="960" height="240" fill="url(#canal)" opacity="0.9"/>
  <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="2" fill="none">
    <path d="M60 540 q40 8 80 0 t80 0 t80 0 t80 0"/>
    <path d="M200 640 q40 8 80 0 t80 0 t80 0"/>
  </g>
  <!-- gondola -->
  <g stroke="#3A2E24" stroke-width="2.5" fill="none">
    <path d="M480 560 C 540 585, 660 585, 720 560 C 720 545, 560 515, 520 520 C 500 524, 470 540, 480 560Z"/>
  </g>
  <!-- lion monument silhouette -->
  <g stroke="#6B5B4C" stroke-width="2.5" fill="none">
    <path d="M760 470 L760 600"/>
    <path d="M760 470 L730 500 L790 500 Z"/>
  </g>
  <text x="480" y="660" text-anchor="middle" font-family="Cormorant Garamond,serif" font-style="italic" font-size="38" fill="#FBF6EC">M &amp; I</text>
</svg>
